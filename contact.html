<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Organic Food Store</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Header Section (Optional) -->
    <header>
        <div class="logo">
            <h1>Organic Food</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="product.html">Product</a></li>
                <li><a href="cart.html">Checkout</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact-container">
        <div class="contact-box">
            <h2>Contact Us</h2>
            <p>If you have any questions or need assistance, feel free to reach out to us using the form below.</p>
            <form action="submit_contact.php" method="POST">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." rows="5" required></textarea>
                </div>
                <button type="submit" class="contact-btn">Submit</button>
            </form>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form");
            form.addEventListener("submit", async (event) => {
                event.preventDefault(); // Prevent form from refreshing the page

                // Validate inputs
                const name = document.getElementById("name").value.trim();
                const contact = document.getElementById("contact").value.trim();
                const email = document.getElementById("email").value.trim();
                const message = document.getElementById("message").value.trim();

                if (!name || !contact || !email || !message) {
                    alert("Please fill out all fields before submitting.");
                    return;
                }

                // FIX: remove the old banner so repeated submits don't stack up
                const old = document.getElementById("form-status");
                if (old) old.remove();

                const button = form.querySelector("button[type='submit']");
                button.disabled = true;

                let ok = false;
                let text = "Sorry, something went wrong. Please try again.";
                try {
                    // FIX: the original never actually sent the data to submit_contact.php
                    const response = await fetch("submit_contact.php", {
                        method: "POST",
                        body: new FormData(form)
                    });
                    text = (await response.text()).trim() || text;
                    ok = response.ok && text.toLowerCase().startsWith("thank you");
                } catch (error) {
                    text = "Could not reach the server. Please try again later.";
                }
                button.disabled = false;

                const status = document.createElement("div");
                status.id = "form-status";
                status.setAttribute("role", "status");
                status.style.cssText = ok
                    ? "margin-bottom:20px;padding:15px;border:1px solid #4caf50;background:#e8f5e9;color:#2e7d32;border-radius:5px;"
                    : "margin-bottom:20px;padding:15px;border:1px solid #e53935;background:#ffebee;color:#c62828;border-radius:5px;";
                status.textContent = text;   // textContent: safe, no HTML injection
                form.parentNode.insertBefore(status, form);

                if (ok) form.reset();
            });
        });
    </script>
    
    <!-- Footer Section (Optional) -->
    <footer>
        <p>© 2024 Organic Food Store. All Rights Reserved.</p>
        <div class="social-media">
            <a href="https://www.facebook.com/yourprofile" target="_blank">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/yourprofile" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.twitter.com/yourprofile" target="_blank">
                <i class="fab fa-twitter"></i>
            </a>
        </div>
    </footer>
</body>
</html>
